name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  census-consistency:
    name: census bookkeeping consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run census bookkeeping consistency check
        run: python3 tools/check_census_consistency.py

  python-compile:
    name: python compile (stdlib only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile repository python
        run: python3 -m compileall -q tools corpus/census-v0.1

  tests:
    name: pytest (only when tests exist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests if present
        run: |
          if [ -d tests ] && [ -n "$(find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \))" ]; then
            # numpy is required: tests import model/effects/reverb1/coefficient_plane.py.
            # A numpy-optional pure-Python fallback was attempted and rejected as
            # infeasible bit-exact: numpy float32 power is not double-pow-then-round
            # (~0.6% 1-ulp divergence), and np.float32 contagion (NEP 50) from
            # _db_to_linear into _coeff_orfanidis double math changes rounding.
            python3 -m pip install --quiet numpy pytest
            python3 -m pytest -q tests
          else
            echo "NOT_RUN: no tests/ directory with test files in this tree; pytest was not executed (coverage: none — this is not a pass)."
          fi

  dag-check:
    name: backlog DAG + board freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate DAG and README board freshness
        run: python3 tools/compile_backlog_dag.py --check
