name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  census-consistency:
    name: census bookkeeping consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run census bookkeeping consistency check
        run: python3 tools/check_census_consistency.py

  provenance-audit:
    name: provenance audit (SXT-019 / #25)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The per-commit gate below needs this branch's own commits AND the
          # base-branch tip as real objects. actions/checkout@v4 fetches depth
          # 1, where any range is unresolvable: the tool then refuses with
          # NOT_RUN (exit 2), so a shallow checkout cannot look like a pass --
          # but it cannot audit anything either. #300.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The audit's own failure detection runs FIRST: if a rule has stopped
      # firing, the tree-level PASS below would be meaningless.
      - name: Negative control (every rule must fire on a deliberate violation)
        run: python3 tools/check_provenance.py --negative-control
      - name: Audit the tree for unattributed third-party-derived content
        run: python3 tools/check_provenance.py
      # Per-commit declaration gate, decided in #300.
      #
      # The tree audit above reads only the bytes that survive to the tip. This
      # repository merges with merge commits (squash and rebase merges are
      # disabled on the forge), so every intermediate commit of a merged branch
      # stays reachable from main and every clone carries its blobs: a carrier
      # added by one commit and removed by the next is published content that no
      # tree audit, in any view, ever reads. This step is the only check for
      # that shape.
      #
      # POLICY (docs/REUSE-AUDIT.md "Adoption mechanics" item 8): a carrier must
      # be declared IN THE COMMIT THAT ADDS IT. Declaring it later in the same
      # branch FAILS here -- including on a merge commit that brought main's
      # newer content under the branch's older manifest, which is the shape 7 of
      # this repository's 16 historical findings have. The remedy is to rebase
      # onto the base branch (what the builder workflow already does before
      # pushing) or to carry the base branch's manifest rows through the merge
      # resolution; both keep the work and drop the finding. There is
      # deliberately no bypass input and no continue-on-error: an unmerged
      # branch's history is still rewritable, which is exactly why the gate sits
      # before the merge and not after it.
      #
      # RANGE: origin/<base ref>..<PR head sha> -- this branch's own commits.
      # Taken from the event payload rather than from HEAD because (1) it
      # resolves identically on a fork PR and a same-repo branch, (2) it skips
      # GitHub's synthetic refs/pull/N/merge commit, which no clone carries,
      # and (3) it excludes everything already on the base branch, so this gate
      # never re-litigates main's existing history (that question stays with
      # #25, and auditing all of published history stays a manual
      # `--commits HEAD` run).
      - name: Audit this branch's own commits for per-commit declaration
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "NOT_RUN: this gate audits a pull request's own commits; on a"
            echo "  '$EVENT_NAME' event there is no such range (on main,"
            echo "  origin/main..HEAD resolves to no commits, which the tool"
            echo "  refuses as NOT_RUN/exit 2 rather than calling an empty range"
            echo "  a pass). Every commit that reaches main passed this gate on"
            echo "  its own pull request. Auditing ALL of published history is"
            echo "  'python3 tools/check_provenance.py --commits HEAD' and is NOT"
            echo "  run here (coverage: none -- this is not a pass)."
            exit 0
          fi
          for rev in "refs/remotes/origin/${BASE_REF}" "${HEAD_SHA}"; do
            if ! git rev-parse --verify --quiet "${rev}^{commit}" >/dev/null; then
              echo "FAIL: ${rev} is not present in this checkout, so this" >&2
              echo "  branch's commit range cannot be audited at all. This job" >&2
              echo "  requires 'fetch-depth: 0' on its checkout step." >&2
              exit 1
            fi
          done
          python3 tools/check_provenance.py \
            --commits "refs/remotes/origin/${BASE_REF}..${HEAD_SHA}"

  python-compile:
    name: python compile (stdlib only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile repository python
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -I -m compileall -q
          compiler corpus/census-v0.1 fixtures model oracle probes tests tools refusal.py

  tests:
    name: pytest (only when tests exist)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests if present
        run: |
          if [ -d tests ] && [ -n "$(find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \))" ]; then
            # numpy is required: tests import model/effects/reverb1/coefficient_plane.py.
            # A numpy-optional pure-Python fallback was attempted and rejected as
            # infeasible bit-exact: numpy float32 power is not double-pow-then-round
            # (~0.6% 1-ulp divergence), and np.float32 contagion (NEP 50) from
            # _db_to_linear into _coeff_orfanidis double math changes rounding.
            python3 -m pip install --quiet numpy pytest
            # -rs prints every skip reason so skipped (NOT_RUN) tests are visible.
            python3 -m pytest -q -rs tests
          else
            echo "NOT_RUN: no tests/ directory with test files in this tree; pytest was not executed (coverage: none — this is not a pass)."
          fi

  rtl-sim:
    name: pytest with Icarus Verilog (simulator skips are failures)
    runs-on: ubuntu-24.04
    env:
      # Package-version strategy: pin the exact Ubuntu 24.04 (noble) apt
      # version. If apt cannot install exactly this version the job fails
      # visibly; bumping it is a deliberate edit, not a silent drift.
      IVERILOG_APT_VERSION: "12.0-2build2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Icarus Verilog
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "iverilog=${IVERILOG_APT_VERSION}"
          command -v iverilog >/dev/null || { echo "FAIL: iverilog not on PATH" >&2; exit 1; }
          command -v vvp >/dev/null || { echo "FAIL: vvp not on PATH" >&2; exit 1; }
          echo "resolved package: $(dpkg-query -W -f='${Package} ${Version}\n' iverilog)"
          iverilog -V | head -n 1
          vvp -V | head -n 1
      - name: Install python dependencies
        run: python3 -m pip install --quiet numpy pytest
      - name: Collect pytest node IDs (required-case inventory input)
        run: |
          set -euo pipefail
          # Same checkout, same test path and plugin flags as the run below.
          # The checker reconciles tests/rtl_sim_required_cases.txt against
          # this listing (stale entry = FAIL) and against the JUnit report.
          python3 -m pytest --collect-only -q -p no:cacheprovider tests > rtl-sim-collected.txt
          echo "collected node IDs: $(grep -c '::' rtl-sim-collected.txt)"
      - name: Run pytest (JUnit XML) and gate on simulator skips
        run: |
          set -uo pipefail
          # Fail before collection if either simulator binary is missing.
          command -v iverilog >/dev/null && command -v vvp >/dev/null || {
            echo "FAIL: iverilog and vvp are both required" >&2; exit 1; }
          start=$(date +%s)
          # GitHub runs this step as `bash -e`; set -uo pipefail does not clear
          # that inherited errexit. Disable it explicitly so a failing pytest
          # still reaches the checker and both statuses are captured.
          # Failure control: tests/test_rtl_ci_step_errexit.py.
          set +e
          python3 -m pytest -q -rs -p no:cacheprovider tests --junitxml=rtl-sim-junit.xml
          pytest_rc=$?
          echo "pytest exit status: ${pytest_rc}; duration: $(( $(date +%s) - start ))s"
          python3 tools/check_rtl_ci_results.py rtl-sim-junit.xml \
            --inventory tests/rtl_sim_required_cases.txt \
            --collected rtl-sim-collected.txt
          check_rc=$?
          echo "report checker exit status: ${check_rc}"
          # Both statuses are independent; neither may mask the other.
          if [ "${pytest_rc}" -ne 0 ]; then exit "${pytest_rc}"; fi
          exit "${check_rc}"
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-sim-junit
          path: |
            rtl-sim-junit.xml
            rtl-sim-collected.txt
          if-no-files-found: warn

  dag-check:
    name: backlog DAG + board freshness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate DAG and README board freshness
        run: python3 tools/compile_backlog_dag.py --check
