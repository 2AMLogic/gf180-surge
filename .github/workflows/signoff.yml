# T1 signoff verdict of record. Re-renders the `klt signoff` report from the
# committed block manifest and byte-compares it with the committed report.
# Separate from ci.yml on purpose: ci.yml's rule that a check that cannot run
# must never look like one that passed stays untouched.
#
# The only claim this gate makes: the committed report equals a fresh render
# of the manifest by the pinned klayout-tools. It establishes no T1 evidence,
# no fidelity, and no synthesis or hardware claim.
#
# The klayout-tools pin lives in signoff/requirements.txt only (one place).
# Action pinning policy is the same as ci.yml: full SHAs with a tag comment.

name: signoff

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: signoff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  klt-signoff:
    name: klt signoff verdict of record
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned klayout-tools
        run: pip install -r signoff/requirements.txt
      - name: Re-render and compare with the committed report
        run: |
          set -uo pipefail
          rc=0
          klt signoff --manifest signoff/block-manifest.json \
                      --format json > "$RUNNER_TEMP/fresh-signoff.json" || rc=$?
          # 0 = every T1 item met; 3 = grader ran clean, some item unmet.
          # Both are valid grader runs. Anything else is a hard error.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff exited $rc (expected 0 or 3)"
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/fresh-signoff.json" signoff/block-manifest.signoff.json; then
            echo "::error::Fresh klt signoff output differs from signoff/block-manifest.signoff.json: the committed verdict of record is stale or hand-edited."
            echo "Regenerate and commit it in the same PR (see README, 'T1 signoff evidence')."
            echo "---- diff (fresh vs committed), pretty-printed ----"
            diff <(python3 -m json.tool "$RUNNER_TEMP/fresh-signoff.json") \
                 <(python3 -m json.tool signoff/block-manifest.signoff.json) || true
            exit 1
          fi
          echo "Committed signoff report matches a fresh klt signoff render."
